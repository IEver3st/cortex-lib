<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cortex-Lib / Showcase</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b111b;color:#eeeee8;font:14px Arial}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:24px;padding:18px 24px;border-bottom:1px solid #293445;flex-wrap:wrap}strong{letter-spacing:2px}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;color:inherit;border:1px solid #39485e;background:transparent;padding:9px 13px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#6b9bfa;color:#08101e;border-color:#6b9bfa}button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px}small{color:#a8b4c6;margin-left:auto}iframe{width:100%;flex:1;border:0;min-height:520px}footer{padding:12px 24px;color:#97a8be;font-size:12px}a{padding:4px 8px;margin-left:15px}</style>
<header><strong>CORTEX / LIB</strong><nav aria-label="Feature scenes"></nav><small>Local browser demo</small></header><iframe title="Cortex-Lib live UI showcase"></iframe><footer>Real Cortex-Lib UI with sample data. Native gameplay and persistence require FiveM.<a href="?gallery=1">Marketing gallery</a></footer>
<script>const names=['Notifications','Menus','Radial','Dialogs','Settings','Interactions'];const frame=document.querySelector('iframe');const nav=document.querySelector('nav');function select(name){for(const b of nav.children)b.setAttribute('aria-pressed',String(b.textContent===name));frame.src='/ui/index.html?scene='+name.toLowerCase();}names.forEach(name=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>select(name);nav.append(b)});if(new URLSearchParams(location.search).has('gallery'))frame.src='/marketing/2026-09-27/source/gallery.html';else select('Notifications');</script></html>
