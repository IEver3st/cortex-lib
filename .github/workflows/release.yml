name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Lua 5.4
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.4

      - name: Validate source
        shell: pwsh
        run: ./scripts/validate-resource.ps1 -Path .

      - name: Check NUI JavaScript
        run: node --check ui/app.js

      - name: Run Node contract tests
        run: node --test tests/*.test.mjs

      - name: Run Lua specs
        shell: bash
        run: |
          set -euo pipefail
          for spec in tests/*_spec.lua; do
            lua5.4 "$spec"
          done

      - name: Check patch whitespace
        run: git show --check --format= "$GITHUB_SHA"

  release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract release metadata
        id: meta
        shell: bash
        run: |
          version=$(sed -n "s/^[[:space:]]*version[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" fxmanifest.lua | head -n1)
          if [ -z "$version" ]; then
            echo "::error::Could not extract version from fxmanifest.lua"
            exit 1
          fi
          repo_name="${GITHUB_REPOSITORY##*/}"
          fx_name=$(sed -n "s/^[[:space:]]*name[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" fxmanifest.lua | head -n1)
          display_name="${fx_name:-$repo_name}"
          tag="v${version}"
          asset="${repo_name}-v${version}.zip"
          echo "name=${repo_name}" >> "$GITHUB_OUTPUT"
          echo "display_name=${display_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "Release tag ${TAG} already exists. Skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Lua 5.4
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.4

      - name: Create release archive
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
          RELEASE_ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail

          mkdir -p ../release
          mapfile -d '' tracked_files < <(git ls-files -z -- . \
            ':(exclude).github/**' \
            ':(exclude).gitignore' \
            ':(exclude).gitattributes' \
            ':(exclude)tests/release_workflow_contract.test.mjs')

          if [ "${#tracked_files[@]}" -eq 0 ]; then
            echo "::error::No tracked release files were selected"
            exit 1
          fi

          git archive \
            --format=zip \
            --prefix="${RELEASE_NAME}/" \
            --output="../release/${RELEASE_ASSET}" \
            HEAD \
            -- "${tracked_files[@]}"

          (
            cd ../release
            sha256sum "${RELEASE_ASSET}" > "${RELEASE_ASSET}.sha256"
          )

      - name: Validate exact release archive
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
          RELEASE_ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail

          mkdir -p ../verify
          unzip -q "../release/${RELEASE_ASSET}" -d ../verify

          cd "../verify/${RELEASE_NAME}"
          pwsh -File "$GITHUB_WORKSPACE/scripts/validate-resource.ps1" -Path .
          node --check ui/app.js
          node --test tests/*.test.mjs

          for spec in tests/*_spec.lua; do
            lua5.4 "$spec"
          done

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.display_name }} ${{ steps.meta.outputs.tag }}
          RELEASE_ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            "../release/${RELEASE_ASSET}" \
            "../release/${RELEASE_ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes
