name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.4

      - name: Validate source
        shell: pwsh
        run: ./scripts/validate-resource.ps1 -Path .

      - name: Check NUI JavaScript
        run: node --check ui/app.js

      - name: Run Node contract tests
        run: node --test tests/*.test.mjs

      - name: Run Lua specs
        run: |
          set -euo pipefail
          for spec in tests/*_spec.lua; do
            lua5.4 "$spec"
          done

      - name: Check patch whitespace
        run: git show --check --format= "$GITHUB_SHA"

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PUBLISH: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      RELEASE_NAME: cortex-lib
      RELEASE_ASSET: cortex-lib.zip
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare automatic version
        id: meta
        run: node scripts/prepare-release.mjs

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.4

      - name: Create release archive
        env:
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p ../release
          mapfile -d '' tracked_files < <(git ls-files -z -- \
            fxmanifest.lua init.lua presentation-client.lua \
            client imports resource server ui README.md README.txt LICENSE THIRD_PARTY_NOTICES.md)

          if [ "${#tracked_files[@]}" -eq 0 ]; then
            echo "::error::No tracked release files were selected"
            exit 1
          fi

          git archive \
            --format=zip \
            --prefix="${RELEASE_NAME}/" \
            --output="../release/${RELEASE_ASSET}" \
            "$RELEASE_COMMIT" \
            -- "${tracked_files[@]}"

          (
            cd ../release
            sha256sum "${RELEASE_ASSET}" > "${RELEASE_ASSET}.sha256"
          )

      - name: Validate exact release archive
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ../verify
          unzip -q "../release/${RELEASE_ASSET}" -d ../verify
          cd "../verify/${RELEASE_NAME}"
          pwsh -File "$GITHUB_WORKSPACE/scripts/validate-resource.ps1" -Path .
          node --check ui/app.js
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find ui -type f -name '*.js' -print0)
          while IFS= read -r -d '' script; do
            luac5.4 -p "$script"
          done < <(find . -type f -name '*.lua' -print0)
          grep -Fx "version '${RELEASE_VERSION}'" fxmanifest.lua
          if grep -q 'tests/client/debug_commands.lua' fxmanifest.lua; then
            echo "::error::Development test menu must not ship"
            exit 1
          fi
          test ! -e AGENTS.md
          test ! -d tests
          test ! -d .github

      - name: Publish immutable tag and release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          gh auth setup-git
          # Never force a tag or move main. Reruns resolve the same source to the same tag.
          git push origin "${RELEASE_COMMIT}:refs/tags/${RELEASE_TAG}"

          # Listing fails closed on auth/API errors; an absent release is different from an outage.
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | {draft, html_url}" | jq -s '.[0] // null')
          if [ "$release" != "null" ] && [ "$(jq -r '.draft' <<< "$release")" = "false" ]; then
            echo "Release ${RELEASE_TAG} is already published; leaving its assets unchanged."
            exit 0
          fi

          if [ "$release" = "null" ]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "cortex-lib $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "../release/${RELEASE_ASSET}" "../release/${RELEASE_ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Verify published download
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir ../download --pattern "$RELEASE_ASSET" --pattern "${RELEASE_ASSET}.sha256"
          cd ../download
          sha256sum --check "${RELEASE_ASSET}.sha256"
          cmp "$RELEASE_ASSET" "../release/$RELEASE_ASSET"

      - name: Release summary
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          {
            echo "### cortex-lib ${RELEASE_TAG}"
            echo "Source: ${GITHUB_SHA}"
            if [ "$PUBLISH" = "true" ]; then
              echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
              echo "Latest ZIP: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/cortex-lib.zip"
            else
              echo "Validation and packaging completed. Publication disabled for this run."
            fi
            cat "../release/${RELEASE_ASSET}.sha256"
            echo "FiveM/CEF runtime acceptance remains a user-run check before pushing runtime changes."
          } >> "$GITHUB_STEP_SUMMARY"
